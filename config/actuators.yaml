# config/actuators.yaml — SIRAH shared actuator configuration (ADR-0009)
# SIRAH = Sistema Inteligente Robótico de Asistencia Humana; this file
# mirrors the eyes subsystem of the general SIRAH project.
#
# ONE source of truth on the PC side for physical limits. Firmware
# `calibration.h` remains the AUTHORITY (ADR-0003/0004); this YAML is the
# runtime-side mirror, validated by a consistency test (Stage 15/16) so no
# contradictory duplication can silently appear.
#
# Values measured manually with the current hardware setup on 2026-08-12.
# Firmware calibration.h is the authority. NO invented limits.
#
# Sign conventions (A1): X normalized −1 left / 0 center / +1 right;
# Y −1 down / 0 center / +1 up. Physical servo inversion is DATA (the
# direction field below), never behavior logic (A1/A9).

version: 1

eyes:
  x:
    # Inverted range: larger angle = left.
    direction: inverted
    left_deg: 150.0
    center_deg: 110.0
    right_deg: 50.0
  y:
    direction: normal
    up_deg: 110.0
    center_deg: 70.0
    down_deg: 40.0

eyelids:
  sup_right:
    open_deg: 157.0
    closed_deg: 80.0
  inf_right:
    open_deg: 20.0
    closed_deg: 69.0
  sup_left:
    open_deg: 87.0
    closed_deg: 150.0
  inf_left:
    open_deg: 130.0
    closed_deg: 70.0

pwm:
  freq_hz: 50
  pulse_us:
    min: 500
    max: 2400
  i2c:
    sda: 21
    scl: 22
    address: "0x40"

channels:
  # PCA9685 actuator wiring (verified hardware record 2026-08-09).
  eye_x: 0
  eye_y: 1
  sup_right: 2
  inf_right: 3
  sup_left: 4
  inf_left: 5
