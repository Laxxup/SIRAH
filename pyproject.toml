[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sirah"
version = "0.3.1"
description = "SIRAH — Sistema Inteligente Robótico de Asistencia Humana; ojos y laboratorio conversacional de baja latencia"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
perception = [
    "opencv-python-headless<5",
    "numpy",
]
gesture = ["mediapipe"]
serial = ["pyserial-asyncio>=0.6"]
cli = ["pyyaml>=6"]
audio = [
    "sounddevice>=0.5.5",
    "onnxruntime>=1.16.1",
    "faster-whisper",
]
vad = ["silero-vad>=6.2.1", "onnxruntime>=1.16.1"]
conversation = ["pydantic>=2"]
local-tts = ["kokoro==0.9.4"]
edge-tts = ["edge-tts>=7.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyyaml>=6",
]

[project.scripts]
sirah-runtime = "sirah.cli.run:main"
sirah-calibrate = "sirah.cli.calibrate:main"
sirah-models = "sirah.cli.models:main"
sirah-conversation = "sirah.cli.conversation:main"
sirah-perceive = "sirah.cli.perceive:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "serial_asyncio",
    "serial.*",
    "cv2",
    "sounddevice",
    "faster_whisper",
    "silero_vad",
    "torch",
    "huggingface_hub",
    "kokoro",
    "edge_tts",
    "serial_asyncio",
    "mediapipe",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
